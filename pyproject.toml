[project]
name = "personal-hub"
version = "1.0.0"
description = "bambetle Hub — Gift List & Event Roles"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.5,<6.1",
    "psycopg2-binary>=2.9",
    "gunicorn>=26.0",
    "python-slugify>=8.0",
    "whitenoise>=6.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-django>=4.5",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hub.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["e2e"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hub", "hub.*", "core", "core.*", "gifts", "gifts.*", "events", "events.*"]