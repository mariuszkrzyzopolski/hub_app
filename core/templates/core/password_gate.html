{% extends 'core/base.html' %}
{% block title %}Wprowadź hasło{% endblock %}
{% block content %}
<div class="gate-container">
    <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="#3a5a40" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Dostęp chroniony
    </h1>
    <p>Aby wyświetlić tę stronę, wprowadź hasło udostępnione przez organizatora.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" name="password" id="password" placeholder="Wprowadź hasło" required minlength="4" maxlength="20" autocomplete="off" autofocus>
        </div>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <button type="submit" class="btn-primary">Wejdź</button>
    </form>
</div>
{% endblock %}
